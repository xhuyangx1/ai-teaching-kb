# 可选 profile：MySQL 8（本机 root 密码未知，默认不启用、不验证连通）
# 启用方式：java -jar target/ai-teaching-kb-1.0.0.jar --spring.profiles.active=mysql
# 需要先手动建库：CREATE DATABASE kb DEFAULT CHARACTER SET utf8mb4;
spring:
  datasource:
    url: "jdbc:mysql://127.0.0.1:3306/kb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: "${MYSQL_PASSWORD:}"
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-mysql.sql
